baseURL: "https://blog.anass.ch/"
title: "Anass Chahbouni"
theme: "blowfish"
defaultContentLanguage: "en"
enableRobotsTXT: true
enableEmoji: true
buildDrafts: false
buildFuture: false
buildExpired: false
summaryLength: 0

pagination:
  pagerSize: 10

taxonomies:
  category: "categories"

outputs:
  home:
    - HTML
    - RSS
    - JSON

sitemap:
  changefreq: weekly
  filename: sitemap.xml
  priority: 0.5

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

params:
  seoTitle: "Blog | Anass Chahbouni"
  colorScheme: ocean
  defaultAppearance: light
  autoSwitchAppearance: false
  enableA11y: false
  enableSearch: true
  enableCodeCopy: true
  enableStructuredBreadcrumbs: true
  fingerprintAlgorithm: sha512
  hotlinkFeatureImage: false
  brandName: "Anass Chahbouni"
  mainSections:
    - posts
  description: "Technical notes on security, identity, infrastructure and the systems we rely on."
  defaultSocialImage: "img/og-default.png"
  copyright: "© 2024 - 2026 Anass CHAHBOUNI"

  seo:
    metaDescriptionOrder:
      - description
      - summary
      - site

  sitemap:
    excludedKinds: []

  header:
    layout: fixed-fill
    mobileMenuStyle: dropdown

  footer:
    showMenu: true
    showCopyright: true
    showThemeAttribution: false
    showAppearanceSwitcher: true
    showScrollToTop: true

  homepage:
    layout: custom
    showRecent: true
    showRecentItems: 10
    showMoreLink: true
    showMoreLinkDest: /posts/
    cardView: false
    cardViewScreenWidth: false

  article:
    showDate: true
    showAuthor: true
    showBreadcrumbs: true
    showReadingTime: true
    showWordCount: true
    showTableOfContents: true
    showTaxonomies: true
    showCategories: true
    showTags: false
    showPagination: true
    showEdit: true
    editURL: "https://github.com/4nass/blog/tree/master/content"
    editAppendPath: true

  list:
    showBreadcrumbs: true
    showSummary: true
    showCards: false
    cardView: false
    cardViewScreenWidth: false
    groupByYear: true

  author:
    name: "Anass CHAHBOUNI"
    headline: "Security, identity and systems"
    bio: "Writing on security research, identity, infrastructure and technology."
    links:
      - linkedin: "https://www.linkedin.com/in/4nass/"
      - github: "https://github.com/4nass"
      - keybase: "https://keybase.io/4nass"

menus:
  main:
    - name: Portfolio
      url: "https://anass.ch/"
      weight: 10
    - name: Writing
      pageRef: posts
      weight: 20
