{{ define "main" }}
  <section class="mx-auto max-w-3xl">
    <header class="mb-10">
      <h1 class="mt-5 text-4xl font-extrabold text-neutral-900 dark:text-neutral">{{ .Title | emojify }}</h1>
    </header>

    {{ range (where site.RegularPages "Section" "posts").GroupByDate "2006" }}
      <section class="mb-12" aria-labelledby="archive-year-{{ .Key }}">
        <h2 id="archive-year-{{ .Key }}" class="mb-4 text-2xl font-bold text-neutral-700 dark:text-neutral-300">{{ .Key }}</h2>
        <ol class="m-0 list-none border-t border-neutral-200 dark:border-neutral-700">
          {{ range .Pages }}
            <li class="border-b border-neutral-200 py-4 dark:border-neutral-700">
              <a href="{{ .RelPermalink }}" class="group block no-underline">
                <span class="block text-sm text-neutral-500 dark:text-neutral-400">{{ .Date.Format "2 January 2006" }}</span>
                <span class="mt-1 block text-lg font-semibold text-neutral-900 group-hover:text-primary-600 dark:text-neutral dark:group-hover:text-primary-400">{{ .Title | emojify }}</span>
              </a>
            </li>
          {{ end }}
        </ol>
      </section>
    {{ end }}
  </section>
{{ end }}
