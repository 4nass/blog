{{ define "main" }}
  <section class="mx-auto max-w-3xl">
    <header>
      <h1 class="mt-5 text-4xl font-extrabold text-neutral-900 dark:text-neutral">{{ .Title | emojify }}</h1>
      <p class="mt-3 text-neutral-600 dark:text-neutral-300">Search across technical notes, vulnerability briefs and hands-on guides.</p>
    </header>
  </section>
  <script>
    window.addEventListener("DOMContentLoaded", function () {
      document.getElementById("search-button")?.click();
    });
  </script>
{{ end }}
